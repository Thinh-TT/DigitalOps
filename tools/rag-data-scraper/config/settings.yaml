# Configuration for Multi-source RAG Data Crawler & Ingestion Pipeline
version: "1.0"

storage:
  staging_base_dir: "storage/staging"
  raw_base_dir: "storage/raw"
  state_db_path: "storage/state/crawler.db"

chunker:
  target_tokens: 448
  soft_max_tokens: 480
  overlap_tokens: 64
  max_tokens: 512
  tokenizer_model: "heuristic:vietnamese-word-1.3x"

ocr:
  tesseract_cmd: "tesseract"
  lang: "vie+eng"
  min_confidence: 60.0
  tessdata_dir: "storage/ocr/tessdata"
  max_pages: 50
  max_image_pixels: 3000000
  page_timeout_seconds: 30

crawler:
  max_concurrent_requests: 5
  request_timeout_seconds: 30
  user_agent: "DigitalOps-RAG-Crawler/1.0 (+http://digitalops.internal)"
  max_response_bytes: 33554432
  max_total_resources: 500
  max_depth: 1
  max_pagination_pages: 25
  retry_attempts: 3
  retry_backoff_base_seconds: 0.5
  retry_max_backoff_seconds: 8.0
  per_host_delay_seconds: 0.2
  per_host_max_concurrent: 2
